name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lab machine and VM names, home paths and image-relative code addresses
  # (.github/scripts/check_lab_leaks.py, shared across the Seihai suite).
  lab-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No lab names, home paths or binary addresses
        run: python3 .github/scripts/check_lab_leaks.py

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is not built on GitHub runners: it is built and tested on the
        # Sequoia VM in the lab (see AGENTS.md, "macOS builds").
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
