[package]
name = "seihai-gserver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A new Graal game server written in Rust on Seihai's core, for classic clients (1.33 to 2.31 first) and Seihai."
repository = "https://github.com/squirelworks/seihai-gserver"
publish = false

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.0.26", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal", "process"] }
# The NPC-server link's wire format (PROTOCOL.md), shared with the NPC-server
# so both sides use one codec.
seihai-npcserver = { git = "https://github.com/squirelworks/seihai-npcserver", rev = "d2694c9c8ace93f05381701bbe8140ac437ad00e" }
sha2 = "0.10"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Live frames are compressed at the fast level (seihai-core uses the default).
flate2 = { version = "1", features = ["zlib-rs"] }

[dev-dependencies]
# Paused time for the world-tick tests.
tokio = { version = "1", features = ["test-util"] }
# The RC tests log in with Seihai's own RC client. rc 60a5d99 (its core bump) is on
# seihai-core v0.0.26 like the server, so the lock has one core.
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "60a5d99290f4d993be013a5fece74702e4a71a28" }

# PBKDF2 and the codecs are slow unoptimised; the tests log in dozens of times.
[profile.dev.package."*"]
opt-level = 2
