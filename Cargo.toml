[package]
name = "seihai-gserver"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A new Graal game server written in Rust on Seihai's core, for classic clients (1.33 to 2.31 first) and Seihai."
repository = "https://github.com/squirelworks/seihai-gserver"
publish = false

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
# TODO(tag): rev of squirelworks/seihai PR "secure-login-sei00001" (the
# SEI00001 secure login). Once that PR is merged and tagged (v0.0.4),
# switch back to `tag = "v0.0.4"`.
seihai-core = { git = "https://github.com/squirelworks/seihai", rev = "fe25c9fc8372773770fb3fbe22fc0326597ee9eb", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
sha2 = "0.10"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# PBKDF2 and the codecs are slow unoptimised; the tests log in dozens of times.
[profile.dev.package."*"]
opt-level = 2
