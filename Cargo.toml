[package]
name = "seihai-gserver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A new Graal game server written in Rust on Seihai's core, for classic clients (1.33 to 2.31 first) and Seihai."
repository = "https://github.com/squirelworks/seihai-gserver"
publish = false

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.7.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal", "process"] }
# The NPC-server link's wire format (PROTOCOL.md), shared with the NPC-server
# so both sides use one codec.
seihai-npcserver = { git = "https://github.com/squirelworks/seihai-npcserver", rev = "6a32a42dcef5b5ea920baecd2bbaf2c09712b21e" }
sha2 = "0.10"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Live frames are compressed at the fast level (seihai-core uses the default).
flate2 = { version = "1", features = ["zlib-rs"] }

[dev-dependencies]
# Paused time for the world-tick tests.
tokio = { version = "1", features = ["test-util"] }
# The RC tests log in with Seihai's own RC client. Pin its v0.7.1 repin so
# npcserver, rc and this crate all declare seihai-core v0.7.1 without a
# temporary [patch] (squirelworks/seihai-core#79).
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "fb79201f005e6567a073bdd6c070e65b7397f86a" }

# PBKDF2 and the codecs are slow unoptimised; the tests log in dozens of times.
[profile.dev.package."*"]
opt-level = 2
